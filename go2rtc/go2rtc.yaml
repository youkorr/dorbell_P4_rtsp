# go2rtc configuration for the ESP32-P4 doorbell.
#
# Place this at /config/go2rtc.yaml (Home Assistant add-on) or next to the
# go2rtc binary, then restart go2rtc.

streams:
  # ---------------------------------------------------------------------
  # Main stream: MJPEG video + G.711 microphone + G.711 backchannel.
  #
  # go2rtc requests the ONVIF backchannel by DEFAULT on a bare rtsp:// URL,
  # so nothing extra is needed here. Careful: as soon as you append ANY '#'
  # fragment to the URL, the default flips off and you have to ask for it
  # back explicitly with '#backchannel=1'.
  #
  #   rtsp://.../doorbell                     -> backchannel ON  (default)
  #   rtsp://.../doorbell#media=video,audio   -> backchannel OFF
  #   rtsp://.../doorbell#backchannel=1       -> backchannel ON  (explicit)
  #
  # Transport is RTP interleaved over TCP, which is go2rtc's default and the
  # only transport the ESP32-P4 server implements. Do not add '#transport=udp'.
  # ---------------------------------------------------------------------
  doorbell:
    - rtsp://USERNAME:PASSWORD@192.168.1.50:8554/doorbell

  # ---------------------------------------------------------------------
  # WebRTC cannot carry MJPEG, so a WebRTC viewer needs the video transcoded
  # to H.264. The audio is NOT touched: G.711 is copied through, which is what
  # keeps the two-way audio working end to end without a codec round trip.
  #
  # Only needed while the doorbell runs `codec: mjpeg`. With `codec: h264` on
  # the ESP32-P4, point the card straight at the `doorbell` stream instead and
  # delete this block — nothing is re-encoded anywhere.
  #
  # Drop '#hardware' if your machine has no VA-API/V4L2 encoder; on a Raspberry
  # Pi or a small x86 box, expect this transcode to cost real CPU.
  # ---------------------------------------------------------------------
  doorbell_webrtc:
    - ffmpeg:doorbell#video=h264#hardware#audio=copy

  # Optional second entry for consumers that must NOT hold the backchannel
  # open, e.g. a recorder or a motion detector running alongside the live view.
  # Requesting the backchannel twice on the same device is the single most
  # common cause of "two-way audio worked once and then stopped".
  doorbell_view_only:
    - rtsp://USERNAME:PASSWORD@192.168.1.50:8554/doorbell#backchannel=0

# ---------------------------------------------------------------------
# WebRTC
#
# The browser has to reach go2rtc directly over UDP. On a LAN, listing the
# host's own address as a candidate is enough; 'stun:8555' additionally
# discovers the public address when you connect from outside.
# ---------------------------------------------------------------------
webrtc:
  listen: ":8555/tcp"
  candidates:
    - 192.168.1.10:8555 # <- the IP of the machine running go2rtc
    - stun:8555

api:
  listen: ":1984"

log:
  level: info
  # Uncomment while bringing the doorbell up: this prints every RTSP request
  # and response, including the SDP and the backchannel negotiation.
  # rtsp: trace
