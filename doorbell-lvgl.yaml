# NOTE : ce fichier est un EXEMPLE à copier dans /config/esphome/.
# `external_components` ne récupère que `components/`, pas ce YAML : après une
# mise à jour du dépôt, recopiez ce fichier si vous voulez les corrections.
## ===========================================================================
##  ESP32-P4 — Sonnette RTSP avec écran LVGL (banc de test)
##
##  Variante "avec écran" de doorbell.yaml, calquée sur la base matérielle
##  validée d'espwebrtcvisio1.yaml : écran MIPI-DSI 1024x600, tactile GT911,
##  caméra OV5647, audio fdaudio (ES8311 + ES7210), WiFi via ESP-Hosted C6.
##
##  La caméra est PARTAGÉE : lvgl_camera_display affiche l'aperçu local sur le
##  canvas, et rtsp_server encode les MÊMES trames RGB565 en MJPEG pour le flux.
##  Une seule tâche fait le dequeue V4L2 (drive_camera), donc aucun conflit.
##
##  Codec vidéo = MJPEG (encodeur JPEG matériel du P4). H.264 reste disponible
##  en option (voir la note plus bas), mais il exige la source V4L2 directe et
##  donc de renoncer à l'aperçu LVGL.
## ===========================================================================

substitutions:
  name: doorbell-p4-lvgl
  friendly_name: Sonnette P4
  col_bg: "0x0B0F14"
  col_panel: "0x161B22"
  col_text: "0xE6EDF3"
  col_text2: "0x8B949E"
  col_green: "0x2EA043"
  col_red: "0xE5484D"
  col_amber: "0xF0883E"
  font_family: Figtree
  font_glyphsets: "GF_Latin_Core"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  flash_size: 32MB
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_GDMA_ISR_IRAM_SAFE: y
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"
      CONFIG_SPIRAM_RODATA: "n"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      # Le serveur RTSP pousse le RTP directement dans lwIP : de la marge sur
      # les sockets et les buffers TCP évite les à-coups sur les trames JPEG.
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_LWIP_SO_RCVBUF: "y"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65534"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65534"
      CONFIG_WIFI_RMT_DYNAMIC_TX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_AMPDU_TX_ENABLED: "y"
      CONFIG_WIFI_RMT_TX_BA_WIN: "32"

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  use_psram: true
  slot: 1

psram:
  mode: hex
  speed: 200MHz

# NOTE: `rtsp_server` et l'option `enable_h264` d'esp_video vivent pour l'instant
# sur la branche de travail ci-dessous. Une fois la PR fusionnee, remplacez ces
# deux `ref:` par `main`.
external_components:
  - source:
      type: git
      url: https://github.com/youkorr/dorbell_P4_rtsp
      ref: claude/esp32-p4-doorbell-rtsp-kodm6j
    components: [rtsp_server]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: claude/esp32-p4-doorbell-rtsp-kodm6j
    components: [esp_video, esp_cam_sensor, lvgl_camera_display]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: main
    components: [lvgl, image, font]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/youkorr/face-toface
      # Alignez ce ref sur celui qui fonctionne dans votre espwebrtcvisio1.yaml
      # si `fdaudio` n'est pas encore sur main.
      ref: main
    components: [fdaudio]
    refresh: 0s

## ===========================================================================
##  Bus, audio, caméra, écran (base matérielle)
## ===========================================================================

i2c:
  - id: bsp_bus
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz

esp_ldo:
  - voltage: 2.5V
    channel: 3
  - voltage: 2.5V
    channel: 4

# Codec audio de la carte : ES8311 en sortie, ES7210 en entrée.
fdaudio:
  id: audio_engine
  lrclk_pin: GPIO10
  bclk_pin: GPIO12
  mclk_pin: GPIO13
  din_pin: GPIO11
  dout_pin: GPIO9
  i2c_port: 0
  output_codec: es8311
  output_address: 0x18
  mic_address: 0x40
  mic_gain_db: 24 # gain analogique de l'ES7210
  output_volume: 60
  sample_rate: 16000
  # Les réglages qui suivent sont DÉSACTIVÉS par défaut dans fdaudio, et c'est
  # la cause habituelle du « on m'entend trop faible ». Ils agissent en amont du
  # serveur RTSP, sur le chemin micro du codec.
  #
  # AGC : remonte automatiquement un micro faible jusqu'à ce niveau de crête.
  # C'est le bon levier ici — préférez-le à un gain fixe, qui sature dès qu'on
  # parle près de la sonnette. 0 = désactivé.
  mic_agc: 10000
  # Atténuation du micro pendant que le haut-parleur joue le correspondant
  # (en %). 80-90 supprime l'écho de conversation. 0 = désactivé.
  echo_suppression: 85
  # Annulation d'écho logicielle. Le défaut de fdaudio est `true` ; ce fichier
  # la forçait à false, ce qui laissait le correspondant s'entendre lui-même.
  enable_aec: true
  # Porte de bruit, en amplitude 0..32767. À n'activer que si le souffle ambiant
  # gêne : elle peut manger le début des phrases. 0 = désactivée.
  noise_gate: 0

microphone:
  - platform: fdaudio
    id: board_microphone
    fdaudio_id: audio_engine

speaker:
  - platform: fdaudio
    id: board_speaker
    fdaudio_id: audio_engine

esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  xclk_freq: 24000000
  enable_isp: true
  use_heap_allocator: false
  # MJPEG passe par l'encodeur JPEG matériel de l'IDF, pas par /dev/video10 :
  # `enable_h264` n'est nécessaire que si vous basculez sur `codec: h264`.
  enable_h264: false

esp_cam_sensor:
  id: p4_cam
  i2c_id: bsp_bus
  sensor_type: ov5647
  resolution: "800x640"
  framerate: 30
  mirror_x: false
  mirror_y: false
  rotation: 0

# Aperçu local sur le canvas LVGL. Il consomme la même caméra que rtsp_server.
lvgl_camera_display:
  id: camera_display
  camera_id: p4_cam
  canvas_id: camera_canvas
  update_interval: 33ms

## ===========================================================================
##  Serveur RTSP — MJPEG + audio bidirectionnel via le codec de la carte
## ===========================================================================

rtsp_server:
  id: doorbell_stream
  port: 8554
  path: /doorbell
  username: !secret rtsp_username
  password: !secret rtsp_password
  # En MJPEG, go2rtc ouvre DEUX sessions RTSP (le transcodage H.264 + le
  # backchannel). 3 laisse de la marge pour un VLC de diagnostic.
  max_clients: 3

  video:
    codec: mjpeg
    # Partage les trames RGB565 de la caméra avec LVGL.
    camera_id: p4_cam
    # lvgl_camera_display fait déjà le dequeue V4L2 : rtsp_server se contente
    # de lire la trame courante. Mettez true si vous retirez l'aperçu LVGL.
    drive_camera: false
    framerate: 15
    # 1..100. Le débit monte très vite avec ce réglage, et le WiFi du P4 passe
    # par l'ESP32-C6 en SDIO : au-delà d'environ 8 Mb/s le tampon d'émission
    # sature et des trames entières sont jetées (le composant le journalise).
    # À 800x640, q25 donne ~40-60 ko par trame, soit ~6 Mb/s à 15 fps.
    #
    # Une image qui semble « pixelisée » n'est pas forcément un manque de
    # qualité : vérifiez d'abord les logs. Des trames jetées, ou des
    # « [mjpeg] error dc » côté go2rtc, produisent une image déchirée que
    # monter la qualité ne fait qu'aggraver, en saturant davantage le lien.
    jpeg_quality: 25
    # --- Option H.264 (test) -------------------------------------------------
    # H.264 lit du YUV420 directement sur /dev/video0 et ne peut donc PAS
    # partager la caméra avec LVGL. Pour l'essayer :
    #   1. enable_h264: true dans le bloc esp_video ci-dessus
    #   2. supprimer camera_id / drive_camera et le bloc lvgl_camera_display
    #   3. codec: h264
    # codec: h264
    # bitrate: 1500000
    # gop: 15

  audio:
    codec: pcmu
    sample_rate: 16000
    # On réutilise le micro et le haut-parleur de la carte (fdaudio) au lieu de
    # piloter des broches I2S : le codec reste partagé avec les autres usages.
    microphone_id: board_microphone
    speaker_id: board_speaker
    # Niveaux appliqués par le pipeline RTSP, APRÈS ceux du codec. On les laisse
    # neutres ici : fdaudio fait déjà l'AGC (`mic_agc` ci-dessus), et empiler un
    # gain fixe par-dessus une AGC ne rend pas plus fort, ça écrête. Réglez le
    # niveau en amont, dans le bloc `fdaudio:`.
    # Ces deux options servent surtout au chemin I2S direct, sans codec.
    gain: 1.0
    volume: 0.8
    half_duplex: true
    talk_timeout: 300ms

  on_client_connected:
    - lvgl.label.update:
        id: stream_status
        text: "● Flux actif"
        text_color: ${col_green}
  on_client_disconnected:
    - lvgl.label.update:
        id: stream_status
        text: "● En attente"
        text_color: ${col_text2}
  on_talk_start:
    - lvgl.label.update:
        id: talk_status
        text: "🔊 On vous parle"
        text_color: ${col_amber}
    - lvgl.widget.show: talk_status
  on_talk_end:
    - lvgl.widget.hide: talk_status

## ===========================================================================
##  Bouton de sonnette, carillon, écran
## ===========================================================================

# Ce banc de test n'a AUCUN bouton câblé : l'appui vient du bouton tactile
# « Sonner » de la page LVGL. Le capteur reste néanmoins exposé à Home
# Assistant, pour que les automatisations (notification, enregistrement...)
# soient les mêmes que sur une sonnette avec bouton physique.
#
# Pour une carte avec un vrai bouton, remplacez ce bloc par :
#   - platform: gpio
#     id: doorbell_button
#     name: "Bouton"
#     pin: {number: GPIOxx, mode: {input: true, pullup: true}, inverted: true}
#     filters: [{delayed_on: 30ms}, {delayed_off: 100ms}]
#     on_press: [{script.execute: ring}]
# en choisissant une broche libre — le lint refuse un GPIO déjà utilisé.
binary_sensor:
  - platform: template
    id: doorbell_button
    name: "Bouton"

# Séquence unique de sonnerie, quelle que soit son origine. Le script pulse le
# capteur pour que Home Assistant voie un appui franc, exactement comme un
# bouton câblé.
script:
  - id: ring
    mode: restart
    then:
      # Trace de diagnostic : si cette ligne n'apparaît pas dans `esphome logs`
      # quand vous appuyez, c'est l'appui tactile qui n'atteint pas le bouton
      # (calibration/rotation du GT911), pas la sonnerie qui échoue.
      - logger.log:
          format: "ring: sequence declenchee"
          level: INFO
      - binary_sensor.template.publish:
          id: doorbell_button
          state: true
      - logger.log:
          format: "ring: binary_sensor 'Bouton' publie a ON"
          level: INFO
      - lvgl.label.update:
          id: stream_status
          text: "● Sonnerie !"
          text_color: ${col_amber}
      - light.turn_on: backlight
      # 5 s, pas une impulsion breve. Un appui d'une seconde declenche bien les
      # automatisations, mais il est INVISIBLE dans Outils de developpement ->
      # Etats : le temps de quitter la sonnette et de revenir a l'ecran, le
      # capteur est deja retombe a 'off', et tout parait casse alors que rien ne
      # l'est. Cinq secondes se voient a l'oeil et couvrent « quelqu'un sonne ».
      - delay: 5s
      - binary_sensor.template.publish:
          id: doorbell_button
          state: false
      - lvgl.label.update:
          id: stream_status
          text: "● En attente"
          text_color: ${col_text2}

# Déclenche la même séquence que le bouton tactile, mais depuis Home Assistant.
# C'est cette entité qu'on accroche à un bouton de la carte Lovelace.
button:
  - platform: template
    name: "Sonner"
    id: ring_button
    icon: mdi:bell-ring
    on_press:
      - script.execute: ring

switch:
  # NOTE : cette carte n'a PAS de relais de carillon sur GPIO — GPIO33 porte le
  # `reset_pin` de l'écran MIPI-DSI (voir le bloc `display:`). Le carillon est
  # donc un bouton tactile LVGL, et la notification part par l'API Home
  # Assistant. Si votre carte a bien un relais libre, redéclarez-le ici sur une
  # broche qui n'est utilisée nulle part ailleurs dans ce fichier.
  - platform: gpio
    pin: GPIO53
    name: "Amplificateur audio"
    id: audio_amplifier
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: GPIO31
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Rétroéclairage"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

font:
  - file: {type: gfonts, family: "${font_family}", weight: 300}
    id: f_18
    size: 18
    glyphsets: ["${font_glyphsets}"]
  - file: {type: gfonts, family: "${font_family}", weight: 600}
    id: f_24
    size: 24
    glyphsets: ["${font_glyphsets}"]

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 8ms
    on_touch:
      - light.turn_on: backlight
      # Diagnostic d'orientation. `rotation: 180` côté LVGL et
      # `mirror_x`/`mirror_y` ci-dessous appliquent CHACUN une rotation de 180° :
      # s'ils se composent au lieu de se compenser, l'appui atterrit au point
      # symétrique et les boutons paraissent morts.
      #
      # Appuyez sur « Sonner » (x 836..1012, y 320..380) et lisez les
      # coordonnées. Si elles sortent vers x~12 y~144, la double rotation est
      # confirmée : retirez `mirror_x`/`mirror_y` OU `rotation: 180`, pas les
      # deux. Retirez ce bloc `logger.log` une fois l'écran calibré.
      - logger.log:
          format: "touch: x=%d y=%d"
          args: [touch.x, touch.y]
          level: INFO
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true

display:
  - platform: mipi_dsi
    id: main_display
    show_test_card: false
    model: CUSTOM
    update_interval: never
    auto_clear_enabled: false
    hsync_back_porch: 160
    lane_bit_rate: 1000Mbps
    color_order: rgb
    lanes: 2
    reset_pin:
      number: 33
    hsync_pulse_width: 70
    hsync_front_porch: 160
    vsync_back_porch: 23
    vsync_pulse_width: 1
    vsync_front_porch: 12
    pclk_frequency: 51MHz
    dimensions:
      width: 1024
      height: 600
    init_sequence:
      - [0xB2, 0x10]
      - [0x80, 0x8B]
      - [0x81, 0x78]
      - [0x82, 0x84]
      - [0x83, 0x88]
      - [0x84, 0xA8]
      - [0x85, 0xE3]
      - [0x86, 0x88]
      - [0x11, 0x00]
      - delay 120ms
      - [0x29]

## ===========================================================================
##  Interface LVGL — aperçu caméra + état du flux
## ===========================================================================

lvgl:
  use_ppa: true
  use_ppa_img: true
  color_depth: 16
  buffer_size: 100%
  byte_order: little_endian
  rotation: 180
  bg_color: ${col_bg}
  pages:
    - id: doorbell_page
      bg_color: ${col_bg}
      on_load:
        - lambda: 'id(camera_display).configure_canvas(id(camera_canvas));'
      widgets:
        # ---------- Barre de titre ----------
        - obj:
            x: 0
            y: 0
            width: 1024
            height: 52
            bg_color: ${col_panel}
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  x: 16
                  y: 12
                  text: "Sonnette ESP32-P4"
                  text_color: ${col_text}
                  text_font: f_24
              - label:
                  id: stream_status
                  align: RIGHT_MID
                  x: -16
                  text: "● En attente"
                  text_color: ${col_text2}
                  text_font: f_18

        # ---------- Aperçu caméra ----------
        - canvas:
            id: camera_canvas
            x: 16
            y: 64
            width: 800
            height: 512
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 2
            border_color: ${col_panel}
            radius: 8
            pad_all: 0

        # ---------- Panneau de droite ----------
        - label:
            x: 836
            y: 72
            text: "Flux RTSP"
            text_color: ${col_text2}
            text_font: f_18
        - label:
            id: rtsp_url
            x: 836
            y: 100
            width: 176
            text: "…"
            text_color: ${col_text}
            text_font: f_18
            long_mode: WRAP

        - label:
            id: talk_status
            x: 836
            y: 200
            hidden: true
            text: "🔊 On vous parle"
            text_color: ${col_amber}
            text_font: f_18

        - label:
            id: client_count
            x: 836
            y: 260
            text: "0 client"
            text_color: ${col_text2}
            text_font: f_18

        # ---------- Carillon ----------
        # Remplace le relais GPIO : sur cette carte GPIO33 est déjà le
        # `reset_pin` de l'écran, il n'y a donc pas de broche libre pour lui.
        - button:
            id: btn_ring
            x: 836
            y: 320
            width: 176
            height: 60
            bg_color: ${col_panel}
            bg_opa: COVER
            border_width: 1
            border_color: ${col_amber}
            radius: 8
            widgets:
              - label:
                  align: CENTER
                  text: "Sonner"
                  text_color: ${col_amber}
                  text_font: f_24
            on_click:
              - script.execute: ring

        # ---------- Ampli ----------
        # Le couper supprime le souffle au repos et, si le codec de la carte
        # renvoie le micro dans le haut-parleur, l'effet Larsen avec lui.
        - button:
            id: btn_amp
            x: 836
            y: 396
            width: 176
            height: 60
            bg_color: ${col_panel}
            bg_opa: COVER
            border_width: 1
            border_color: ${col_text2}
            radius: 8
            widgets:
              - label:
                  id: amp_label
                  align: CENTER
                  text: "Ampli ON"
                  text_color: ${col_text}
                  text_font: f_18
            on_click:
              - switch.toggle: audio_amplifier
              # Retour visuel immédiat ; le bloc `interval:` en bas de fichier
              # rattrape en plus les basculements venus de Home Assistant.
              - lvgl.label.update:
                  id: amp_label
                  text: !lambda |-
                    return id(audio_amplifier).state ? std::string("Ampli ON") : std::string("Ampli OFF");

interval:
  - interval: 5s
    then:
      - lvgl.label.update:
          id: rtsp_url
          text: !lambda 'return id(doorbell_stream).stream_url();'
      - lvgl.label.update:
          id: client_count
          text: !lambda |-
            const uint8_t n = id(doorbell_stream).client_count();
            return std::to_string(n) + (n > 1 ? " clients" : " client");
      # Rattrape un basculement fait depuis Home Assistant. L'appui sur le
      # bouton, lui, met l'étiquette à jour immédiatement.
      # `std::string(...)` est obligatoire : un ternaire entre deux littéraux
      # produit un `const char*`, sur lequel LVGL appelle ensuite `.c_str()`.
      - lvgl.label.update:
          id: amp_label
          text: !lambda |-
            return id(audio_amplifier).state ? std::string("Ampli ON") : std::string("Ampli OFF");
