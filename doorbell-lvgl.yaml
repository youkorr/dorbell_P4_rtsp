## ===========================================================================
##  Buses, audio, camera, display (the hardware base)
## ===========================================================================

i2c:
  - id: bsp_bus
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz 

esp_ldo:
  - voltage: 2.5V
    channel: 3


# The board's audio codec: ES8311 out, ES7210 in.
fdaudio:
  id: audio_engine
  lrclk_pin: GPIO10
  bclk_pin: GPIO12
  mclk_pin: GPIO13
  din_pin: GPIO11
  dout_pin: GPIO9
  i2c_port: 0
  output_codec: es8311
  output_address: 0x18
  mic_address: 0x40
  mic_gain_db: 24
  output_volume: 60
  sample_rate: 16000
  enable_aec: false
  mic_agc: 10000        # automatically lifts a quiet microphone
  echo_suppression: 85  # ducks the mic while the far end is talking
  noise_gate: 0

microphone:
  - platform: fdaudio
    id: board_microphone
    fdaudio_id: audio_engine

speaker:
  - platform: fdaudio
    id: board_speaker
    fdaudio_id: audio_engine

esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  xclk_freq: 24000000
  enable_jpeg: true
  enable_isp: true
  use_heap_allocator: false


esp_cam_sensor:
  id: p4_cam
  i2c_id: bsp_bus
  sensor_type: ov5647
  resolution: "800x640"
  framerate: 30
  mirror_x: false
  mirror_y: false
  rotation: 0

# Local preview on the LVGL canvas. It consumes the same camera as rtsp_server.
lvgl_camera_display:
  id: camera_display
  camera_id: p4_cam
  canvas_id: camera_canvas
  update_interval: 33ms

## ===========================================================================
##  RTSP server — MJPEG + two-way audio through the board's codec
## ===========================================================================

rtsp_server:
  id: doorbell_stream
  port: 8554
  path: /doorbell
  username: !secret rtsp_username
  password: !secret rtsp_password
  max_clients: 4

  # Announce the backchannel's `sendonly` track to EVERYONE, not just to a
  # client that sends the ONVIF `Require` header. This is what makes two-way
  # audio DISCOVERABLE: go2rtc, Frigate and the Lovelace cards decide whether a
  # camera can be talked to by probing the stream, and a track announced only on
  # request is invisible to that probe. Without this the microphone button never
  # appears -- on a device whose backchannel works perfectly.
  backchannel: always

  video:
    # MJPEG and nothing else. The P4 can encode H.264 but cannot decode it: the
    # LVGL preview could not display it again, and its encoder wants YUV420 where
    # LVGL wants RGB565 -- so the screen and the stream could not share one
    # camera, which is the whole point of this build.
    # Shares the camera's RGB565 frames with LVGL.
    camera_id: p4_cam
    # lvgl_camera_display already dequeues the V4L2 buffers, so rtsp_server just
    # reads the current frame. The "local camera preview" switch hands the
    # dequeue back to the server when the preview goes off, so the stream never
    # freezes.
    drive_camera: false
    framerate: 15
    jpeg_quality: 25

  audio:
    codec: pcmu
    sample_rate: 16000
    # Reuse the board's microphone and speaker (fdaudio) rather than driving
    # raw I2S pins: the codec stays shared with any other consumer.
    microphone_id: board_microphone
    speaker_id: board_speaker
    # Digital gain applied AFTER the codec.
    #
    # This used to be 1.0, on the theory that fdaudio already runs AGC and that
    # stacking a fixed gain on top would only clip. Measurement said otherwise:
    # on this board the microphone arrives around -58 dBFS, a thousandth of full
    # scale. The AGC does not lift it, and at that level nothing is audible --
    # not in Home Assistant, not even through the local loopback.
    #
    # 8.0 = +18 dB, which brings -58 dBFS to about -40. Raise it in steps while
    # watching `max/60s` in the logs; aim for -30..-6 dBFS while speaking in
    # front of the doorbell. If the hiss rises as much as the voice, the gain is
    # amplifying noise: back off and raise `mic_gain_db` in the `fdaudio:` block
    # instead, which acts before the converter.
    gain: 8.0
    volume: 0.8
    half_duplex: true
    talk_timeout: 300ms

  on_client_connected:
    - lvgl.label.update:
        id: stream_status
        text: "Flux actif"
        text_color: ${col_green}
  on_client_disconnected:
    - lvgl.label.update:
        id: stream_status
        text: "En attente"
        text_color: ${col_text2}
  on_talk_start:
    - lvgl.label.update:
        id: talk_status
        text: "On vous parle"
        text_color: ${col_amber}
    - lvgl.widget.show: talk_status
  on_talk_end:
    - lvgl.widget.hide: talk_status



## ===========================================================================
##  The ring — the three ways a press reaches Home Assistant
##
##  A `binary_sensor` alone was not enough, and that is exactly why "I press
##  Ring and nothing happens in Home Assistant":
##
##   * it surfaces nowhere on its own. No camera card reacts to a binary_sensor;
##     it takes an automation to be of any use (docs/home-assistant.md §10);
##   * it carries no `device_class`, so Home Assistant cannot tell it is a
##     doorbell;
##   * a pulse can be missed: if the API was disconnected at that instant, the
##     information is simply lost.
##
##  Hence the three paths below, most useful first. The first one is enough in
##  almost every case.
## ===========================================================================

# 1. The entity Home Assistant understands NATIVELY as a doorbell. It appears as
#    `event.<device>_sonnette`, its state is the timestamp of the last press, and
#    it can be picked straight out of the automation editor as a trigger. This is
#    the one to use.
event:
  - platform: template
    id: doorbell_event
    name: "Sonnette"
    device_class: doorbell
    event_types:
      - pressed

binary_sensor:
  # 2. The state sensor, for cards and conditions that want an on/off rather
  #    than an event. `occupancy` is the class Home Assistant associates with
  #    "someone is at the door".
  - platform: template
    id: doorbell_button
    name: "Bouton"
    device_class: occupancy

  # Diagnostics: the audio, seen from Home Assistant. These entities answer
  # "is the microphone working?" without opening the logs.
  - platform: template
    name: "Micro actif"
    id: mic_alive_sensor
    device_class: problem
    entity_category: diagnostic
    # `problem` reads inverted on purpose: ON means there IS a problem, i.e. the
    # microphone source has stopped delivering samples altogether.
    lambda: 'return !id(doorbell_stream).mic_alive();'
  - platform: template
    name: "On vous parle"
    id: talking_sensor
    entity_category: diagnostic
    lambda: 'return id(doorbell_stream).is_talking();'
  - platform: template
    name: "Flux RTSP actif"
    id: streaming_sensor
    entity_category: diagnostic
    lambda: 'return id(doorbell_stream).is_streaming();'

  # ON means a problem: the speaker did not take everything it was given. This
  # is the first entity to look at when no sound comes out of the P4.
  - platform: template
    name: "Sortie audio en defaut"
    id: speaker_problem_sensor
    device_class: problem
    entity_category: diagnostic
    lambda: 'return !id(doorbell_stream).speaker_healthy();'

script:
  - id: ring
    mode: restart
    then:
      # Diagnostic trace: if this line does not appear in `esphome logs` when
      # you press, it is the touch that never reached the widget (GT911
      # calibration or rotation), not the ring that failed.
      - logger.log:
          format: "ring: sequence declenchee"
          level: INFO

      # Path 1: the `event` entity. Home Assistant timestamps and keeps it, so
      # nothing is lost even if nobody is looking at that moment.
      - event.trigger:
          id: doorbell_event
          event_type: pressed

      # Path 3: a raw event on the Home Assistant bus, for automations written
      # in YAML. Trigger it with:
      #   trigger: {platform: event, event_type: esphome.doorbell_pressed}
      - homeassistant.event:
          event: esphome.doorbell_pressed
          data:
            device: doorbell-p4-lvgl

      # Path 2: the state sensor.
      - binary_sensor.template.publish:
          id: doorbell_button
          state: true
      - logger.log:
          format: "ring: event 'pressed' + binary_sensor 'Bouton' ON + evenement esphome.doorbell_pressed"
          level: INFO

      - lvgl.label.update:
          id: stream_status
          text: "Sonnerie !"
          text_color: ${col_amber}
      - light.turn_on: backlight
      # 5 s, pas une impulsion breve. Un appui d'une seconde declenche bien les
      # automatisations, mais il est INVISIBLE dans Outils de developpement ->
      # Etats : le temps de quitter la sonnette et de revenir a l'ecran, le
      # capteur est deja retombe a 'off', et tout parait casse alors que rien ne
      # l'est. Cinq secondes se voient a l'oeil et couvrent « quelqu'un sonne ».
      - delay: 5s
      - binary_sensor.template.publish:
          id: doorbell_button
          state: false
      - lvgl.label.update:
          id: stream_status
          text: "En attente"
          text_color: ${col_text2}

# Runs the same sequence as the touch button, but from Home Assistant. This is
# the entity to wire to a button on the Lovelace card.
button:
  - platform: template
    name: "Sonner"
    id: ring_button
    icon: mdi:bell-ring
    on_press:
      - script.execute: ring

  # Proves the speaker on its own. No beep means there is no point looking at
  # Home Assistant or go2rtc.
  - platform: template
    name: "Bip de test"
    id: test_tone_button
    icon: mdi:volume-high
    entity_category: diagnostic
    on_press:
      - switch.turn_on: audio_amplifier
      - rtsp_server.play_test_tone:
          id: doorbell_stream
          frequency: 1000
          duration: 600ms

sensor:
  # The microphone level, measured after the gain stage -- so exactly what the
  # far end will hear. Read it like this:
  #   -100 dBFS  : digital silence. The mic delivers zeros: wrong I2S slot, dead
  #                capsule, gain at zero. No network setting will help.
  #    -60 .. -40 : it hears, but faintly. Raise `mic_gain_db` in fdaudio.
  #    -30 ..  -6 : a healthy speech level.
  #      > -3     : clipping. Lower the gain.
  - platform: template
    name: "Niveau micro"
    id: mic_level_sensor
    unit_of_measurement: dBFS
    accuracy_decimals: 0
    device_class: sound_pressure
    state_class: measurement
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return id(doorbell_stream).mic_level_db();'

  - platform: template
    name: "Niveau haut-parleur"
    id: speaker_level_sensor
    unit_of_measurement: dBFS
    accuracy_decimals: 0
    device_class: sound_pressure
    state_class: measurement
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return id(doorbell_stream).speaker_level_db();'

  # These counters separate "nothing arrives" from "it arrives and is
  # inaudible". If this stays at 0 while you press talk in Home Assistant, the
  # downstream voice never even reaches the P4: the fault is upstream (go2rtc,
  # backchannel not negotiated), not in this component.
  - platform: template
    name: "Paquets audio recus"
    id: audio_rx_sensor
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(doorbell_stream).audio_packets_received();'

  - platform: template
    name: "Paquets audio envoyes"
    id: audio_tx_sensor
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(doorbell_stream).audio_packets_sent();'

  # The pair that settles "I hear nothing coming out of the P4". If "offered"
  # rises while "accepted" stays at 0, the speaker refuses everything: stopped,
  # never started, or the format displeases it. No volume setting will change
  # anything.
  - platform: template
    name: "Octets audio proposes au HP"
    id: spk_offered_sensor
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(doorbell_stream).speaker_bytes_offered();'

  - platform: template
    name: "Octets audio acceptes par le HP"
    id: spk_written_sensor
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(doorbell_stream).speaker_bytes_written();'

switch:
  - platform: gpio
    pin: GPIO53
    name: "Amplificateur audio"
    id: audio_amplifier
    restore_mode: ALWAYS_ON
  #- platform: gpio
    #id: chime_relay
    #name: "Carillon"
    #pin: GPIO33
    #restore_mode: ALWAYS_OFF
  - platform: template
    name: "Aperçu caméra locale"
    id: lvgl_display_enable_switch
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    # Only one task may dequeue the V4L2 buffers. While the preview runs it is
    # the preview; the moment it goes off, the dequeue returns to the RTSP
    # server -- otherwise nobody dequeues and the stream freezes on its last
    # frame, with no error anywhere.
    turn_on_action:
      - lambda: |-
          id(camera_display).set_enabled(true);
          id(doorbell_stream).set_drive_camera(false);
    turn_off_action:
      - lambda: |-
          id(camera_display).set_enabled(false);
          id(doorbell_stream).set_drive_camera(true);

  # The decisive test for "I cannot tell whether the microphone and the audio
  # work": switch it on, speak in front of the doorbell, and you hear yourself
  # through its speaker. If you do, capture, gain, G.711 companding and playback
  # all work -- what remains is in the network, go2rtc or Home Assistant, not in
  # the device.
  #
  # A bench test, not a mode to leave on: microphone and speaker share the
  # board, so howling is only a matter of volume. It stops itself after two
  # minutes, and the backchannel takes priority while it runs.
  - platform: template
    name: "Test audio (boucle micro vers haut-parleur)"
    id: audio_loopback_switch
    icon: mdi:microphone-message
    entity_category: diagnostic
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - switch.turn_on: audio_amplifier
      - rtsp_server.set_loopback:
          id: doorbell_stream
          state: true
      - logger.log:
          format: "audio: boucle locale ACTIVEE -- parlez, vous devez vous entendre"
          level: INFO
    turn_off_action:
      - rtsp_server.set_loopback:
          id: doorbell_stream
          state: false
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Rétroéclairage"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

font:
  - file: {type: gfonts, family: "${font_family}", weight: 300}
    id: f_18
    size: 18
    glyphsets: ["${font_glyphsets}"]
  - file: {type: gfonts, family: "${font_family}", weight: 600}
    id: f_24
    size: 24
    glyphsets: ["${font_glyphsets}"]

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 8ms
    on_touch:
      - light.turn_on: backlight
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true

display:
  - platform: mipi_dsi
    id: main_display
    show_test_card: false
    model: CUSTOM
    update_interval: never
    auto_clear_enabled: false
    hsync_back_porch: 160
    lane_bit_rate: 1000Mbps
    color_order: rgb
    lanes: 2
    reset_pin:
      number: 33
    hsync_pulse_width: 70
    hsync_front_porch: 160
    vsync_back_porch: 23
    vsync_pulse_width: 1
    vsync_front_porch: 12
    pclk_frequency: 51MHz
    dimensions:
      width: 1024
      height: 600
    init_sequence:
      - [0xB2, 0x10]
      - [0x80, 0x8B]
      - [0x81, 0x78]
      - [0x82, 0x84]
      - [0x83, 0x88]
      - [0x84, 0xA8]
      - [0x85, 0xE3]
      - [0x86, 0x88]
      - [0x11, 0x00]
      - delay 120ms
      - [0x29]

## ===========================================================================
##  LVGL interface — camera preview and stream status
## ===========================================================================

lvgl:
  use_ppa: true
  use_ppa_img: true
  color_depth: 16
  buffer_size: 100%
  byte_order: little_endian
  rotation: 180
  bg_color: ${col_bg}
  pages:
    - id: doorbell_page
      bg_color: ${col_bg}
      on_load:
        # The canvas only exists once the page is built, hence doing this here
        # rather than in `lvgl_camera_display:`. `set_enabled` is reapplied just
        # after: the component starts disabled, and if the switch had already
        # restored its ON state before LVGL was ready, the preview stayed black
        # with nothing to say so.
        - lambda: |-
            id(camera_display).configure_canvas(id(camera_canvas));
            id(camera_display).set_enabled(id(lvgl_display_enable_switch).state);
      widgets:
        # ---------- Barre de titre ----------
        - obj:
            x: 0
            y: 0
            width: 1024
            height: 52
            bg_color: ${col_panel}
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  x: 16
                  y: 12
                  text: "Sonnette ESP32-P4"
                  text_color: ${col_text}
                  text_font: f_24
              - label:
                  id: stream_status
                  align: RIGHT_MID
                  x: -16
                  text: "En attente"
                  text_color: ${col_text2}
                  text_font: f_18

        # ---------- Camera preview ----------
        - canvas:
            id: camera_canvas
            x: 16
            y: 64
            width: 800
            height: 512
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 2
            border_color: ${col_panel}
            radius: 8
            pad_all: 0

        # ---------- Panneau de droite ----------
        - label:
            x: 836
            y: 72
            text: "Flux RTSP"
            text_color: ${col_text2}
            text_font: f_18
        - label:
            id: rtsp_url
            x: 836
            y: 100
            width: 176
            text: "…"
            text_color: ${col_text}
            text_font: f_18
            long_mode: WRAP

        - label:
            id: talk_status
            x: 836
            y: 172
            hidden: true
            text: "On vous parle"
            text_color: ${col_amber}
            text_font: f_18

        - label:
            id: client_count
            x: 836
            y: 200
            text: "0 client"
            text_color: ${col_text2}
            text_font: f_18

        # ---------- Microphone meter ----------
        # The visual answer to "does the microphone hear anything". The bar
        # moves when you speak in front of the doorbell; if it stays flat the
        # fault is here, on the device, and nothing set in Home Assistant or
        # go2rtc will change it.
        - label:
            x: 836
            y: 232
            text: "Micro"
            text_color: ${col_text2}
            text_font: f_18
        - bar:
            id: mic_bar
            x: 836
            y: 258
            width: 176
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            bg_color: ${col_panel}
            indicator:
              bg_color: ${col_green}
        - label:
            id: mic_db_label
            x: 836
            y: 278
            text: "—"
            text_color: ${col_text2}
            text_font: f_18

        # ---------- Speaker meter ----------
        # The counterpart of the microphone meter, for the downstream side. It
        # measures what the speaker ACCEPTED, not what it was offered: a stopped
        # component that refuses everything leaves the bar flat, which is exactly
        # the "I press Beep and hear nothing" fault.
        - label:
            x: 836
            y: 302
            text: "Haut-parleur"
            text_color: ${col_text2}
            text_font: f_18
        - bar:
            id: spk_bar
            x: 836
            y: 328
            width: 176
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            bg_color: ${col_panel}
            indicator:
              bg_color: ${col_amber}
        - label:
            id: spk_db_label
            x: 836
            y: 348
            text: "—"
            text_color: ${col_text2}
            text_font: f_18

        # ---------- Carillon ----------
        # Replaces the GPIO relay: on this board GPIO33 is already the display
        # `reset_pin`, so there is no free pin for it.
        - button:
            id: btn_ring
            x: 836
            y: 372
            width: 176
            height: 54
            bg_color: ${col_panel}
            bg_opa: COVER
            border_width: 1
            border_color: ${col_amber}
            radius: 8
            widgets:
              - label:
                  align: CENTER
                  text: "Sonner"
                  text_color: ${col_amber}
                  text_font: f_24
            on_click:
              - script.execute: ring

        # ---------- Test audio ----------
        # The button that answers, on its own and on the spot, "do the
        # microphone and the speaker work?". Press, speak: if you hear yourself,
        # the device's whole audio chain is sound.
        - button:
            id: btn_audio_test
            x: 836
            y: 492
            width: 84
            height: 54
            bg_color: ${col_panel}
            bg_opa: COVER
            border_width: 1
            border_color: ${col_text2}
            radius: 8
            widgets:
              - label:
                  id: audio_test_label
                  align: CENTER
                  text: "Test\nmicro"
                  text_color: ${col_text}
                  text_font: f_18
            on_click:
              - switch.toggle: audio_loopback_switch
              - lvgl.label.update:
                  id: audio_test_label
                  text: !lambda |-
                    return id(audio_loopback_switch).state ? std::string("Boucle\nON") : std::string("Test\nmicro");

        # Le bip : prouve le haut-parleur tout seul, sans passer par le micro.
        - button:
            id: btn_beep
            x: 928
            y: 492
            width: 84
            height: 54
            bg_color: ${col_panel}
            bg_opa: COVER
            border_width: 1
            border_color: ${col_text2}
            radius: 8
            widgets:
              - label:
                  align: CENTER
                  text: "Bip"
                  text_color: ${col_text}
                  text_font: f_18
            on_click:
              - switch.turn_on: audio_amplifier
              - rtsp_server.play_test_tone:
                  id: doorbell_stream
                  frequency: 1000
                  duration: 600ms

        # ---------- Ampli ----------
        # Le couper supprime le souffle au repos et, si le codec de la carte
        # renvoie le micro dans le haut-parleur, l'effet Larsen avec lui.
        - button:
            id: btn_amp
            x: 836
            y: 432
            width: 176
            height: 54
            bg_color: ${col_panel}
            bg_opa: COVER
            border_width: 1
            border_color: ${col_text2}
            radius: 8
            widgets:
              - label:
                  id: amp_label
                  align: CENTER
                  text: "Ampli ON"
                  text_color: ${col_text}
                  text_font: f_18
            on_click:
              - switch.toggle: audio_amplifier
              # Immediate visual feedback; the `interval:` block at the end of
              # the file also catches toggles made from Home Assistant.
              - lvgl.label.update:
                  id: amp_label
                  text: !lambda |-
                    return id(audio_amplifier).state ? std::string("Ampli ON") : std::string("Ampli OFF");

interval:
  # The meters, refreshed fast enough to follow speech. The level decays on its
  # own after a second of silence, so a bar stuck at the top means clipping and a
  # bar stuck at the bottom means nothing is being picked up.
  - interval: 250ms
    then:
      - lvgl.bar.update:
          id: mic_bar
          value: !lambda |-
            // -60 dBFS -> 0 %, 0 dBFS -> 100 %. L'échelle est logarithmique
            // exprès : en linéaire, la parole ordinaire ne décolle pas du zéro.
            const float db = id(doorbell_stream).mic_level_db();
            int pct = static_cast<int>((db + 60.0f) * 100.0f / 60.0f);
            return pct < 0 ? 0 : (pct > 100 ? 100 : pct);
      - lvgl.label.update:
          id: mic_db_label
          text: !lambda |-
            if (!id(doorbell_stream).audio_running())
              return std::string("audio arrete");
            if (!id(doorbell_stream).mic_alive())
              return std::string("micro muet !");
            char buf[24];
            snprintf(buf, sizeof(buf), "%.0f dBFS", id(doorbell_stream).mic_level_db());
            return std::string(buf);

      # The output-side counterpart. Same scale, same reading.
      - lvgl.bar.update:
          id: spk_bar
          value: !lambda |-
            const float db = id(doorbell_stream).speaker_level_db();
            int pct = static_cast<int>((db + 60.0f) * 100.0f / 60.0f);
            return pct < 0 ? 0 : (pct > 100 ? 100 : pct);
      - lvgl.label.update:
          id: spk_db_label
          text: !lambda |-
            if (!id(doorbell_stream).has_speaker())
              return std::string("pas de HP");
            // The case that matters: bytes were pushed, the speaker took none.
            // Nothing will come out, whatever the volume.
            const uint32_t offered = id(doorbell_stream).speaker_bytes_offered();
            if (offered > 0 && id(doorbell_stream).speaker_bytes_written() == 0)
              return std::string("HP refuse tout !");
            if (offered == 0)
              return std::string("rien joue");
            char buf[24];
            snprintf(buf, sizeof(buf), "%.0f dBFS", id(doorbell_stream).speaker_level_db());
            return std::string(buf);

  - interval: 5s
    then:
      - lvgl.label.update:
          id: rtsp_url
          text: !lambda 'return id(doorbell_stream).stream_url();'
      - lvgl.label.update:
          id: client_count
          text: !lambda |-
            const uint8_t n = id(doorbell_stream).client_count();
            return std::to_string(n) + (n > 1 ? " clients" : " client");
      # Rattrape un basculement fait depuis Home Assistant. L'appui sur le
      # pressing the button updates the label immediately.
      # `std::string(...)` is required: a ternary between two literals yields a
      # `const char*`, on which LVGL then calls `.c_str()`.
      - lvgl.label.update:
          id: amp_label
          text: !lambda |-
            return id(audio_amplifier).state ? std::string("Ampli ON") : std::string("Ampli OFF");
      # The loopback monitor stops itself after two minutes. Without this
      # resync the switch would still read ON while the component has already
      # cut it -- and you would go hunting for a howl that no longer exists.
      - if:
          condition:
            lambda: 'return id(audio_loopback_switch).state && !id(doorbell_stream).audio_loopback();'
          then:
            - switch.turn_off: audio_loopback_switch
            - lvgl.label.update:
                id: audio_test_label
                text: "Test\nmicro"

