# Frigate — configuration minimale pour la sonnette ESP32-P4.
#
# À placer dans /config/frigate.yaml, puis redémarrer Frigate.
#
# Volontairement réduite au strict nécessaire : moins de clés, moins de
# validation à échouer. Les options avancées (semantic_search, face_recognition,
# lpr, classification, notifications, réglages fins d'enregistrement) sont
# absentes — rajoutez-les une par une APRÈS que cette base démarre, jamais
# toutes en même temps. Une seule clé refusée invalide le fichier entier.
#
# ---------------------------------------------------------------------------
# TROIS VALEURS À REMPLACER, toutes en MAJUSCULES ci-dessous :
#
#   MOT_DE_PASSE_MQTT        mot de passe du broker
#   MOT_DE_PASSE_TAPO        caméra Tapo
#   MOT_DE_PASSE_SONNETTE    `password:` du bloc `rtsp_server:` de l'ESPHome
#
# Elles sont écrites en clair : ce sont de simples chaînes, pas la substitution
# {FRIGATE_...} qui fait rejeter TOUTE la configuration quand la variable
# d'environnement n'existe pas — sans jamais dire laquelle manque.
# ---------------------------------------------------------------------------

version: 0.17-0

mqtt:
  host: 192.168.1.38
  port: 1883
  user: frigate
  password: MOT_DE_PASSE_MQTT

detectors:
  coral:
    type: edgetpu
    device: pci

# ---------------------------------------------------------------------------
# go2rtc — embarqué dans Frigate, configuré ici.
# N'utilisez PAS l'add-on go2rtc en plus : les deux se disputent les ports.
# ---------------------------------------------------------------------------
go2rtc:
  streams:
    frigate1:
      - rtsp://Tapoone:MOT_DE_PASSE_TAPO@192.168.1.13:554/stream1
      - ffmpeg:frigate1#audio=aac

    frigate1_esp32:
      - ffmpeg:rtsp://Tapoone:MOT_DE_PASSE_TAPO@192.168.1.13:554/stream2#video=mjpeg#width=640#height=480#q:v=5#huffman=0#fps=15

    # Entrée du transcodage. `#backchannel=0` est obligatoire : une SEULE source
    # doit tenir le backchannel ONVIF ouvert, sinon le push-to-talk marche une
    # fois puis plus jamais. C'est doorbell_webrtc qui le porte, plus bas.
    doorbell:
      - rtsp://1169:MOT_DE_PASSE_SONNETTE@192.168.1.9:8554/doorbell#backchannel=0

    # WebRTC ne transporte pas de MJPEG : la vidéo doit passer en H.264.
    #   -r 15  cadence constante. Les horodatages du P4 viennent d'un timer
    #          logiciel ; irréguliers, ils donnent des saccades en WebRTC (MSE
    #          les tolère, d'où une interface Frigate fluide et une carte hachée
    #          sur le même flux).
    #   -g 15  une image clé par seconde, contre 3,3 s avec le -g 50 par défaut.
    # Pas de `#audio=copy` : ffmpeg n'a pas de piste audio à copier ici et
    # sortirait en erreur, que go2rtc relancerait en boucle. L'audio et le
    # backchannel arrivent par la seconde source, en G.711 intact.
    doorbell_webrtc:
      - ffmpeg:doorbell#video=h264#raw=-r 15 -g 15 -keyint_min 15
      - rtsp://1169:MOT_DE_PASSE_SONNETTE@192.168.1.9:8554/doorbell#backchannel=1

  webrtc:
    listen: :8555
    # Le navigateur doit pouvoir joindre AU MOINS un de ces candidats. Gardez
    # les deux : le LAN quand vous êtes à la maison, le tailnet à distance.
    # L'adresse 100.x s'obtient par `tailscale ip -4` sur la machine Frigate.
    # Ne laissez jamais le 1.2.3.4 de la documentation : un candidat
    # inatteignable donne une connexion qui s'établit sans jamais d'image.
    candidates:
      - 192.168.1.38:8555
      - 100.X.Y.Z:8555

record:
  enabled: false

snapshots:
  enabled: true

cameras:
  frigate1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/frigate1
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 1024
      height: 600
      fps: 5
    objects:
      track:
        - person

  doorbell:
    ffmpeg:
      inputs:
        # Le restream de go2rtc, jamais le P4 directement : celui-ci n'a ainsi
        # qu'un seul client RTSP à servir quel que soit le nombre de vues.
        - path: rtsp://127.0.0.1:8554/doorbell_webrtc
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      # Résolution du capteur, telle que réglée dans le YAML ESPHome.
      width: 800
      height: 640
      fps: 5
    objects:
      track:
        - person
    live:
      # Syntaxe 0.15+ : « nom affiché » -> flux go2rtc.
      # (`stream_name:` était la forme 0.14, elle n'existe plus.)
      streams:
        Sonnette: doorbell_webrtc

# ---------------------------------------------------------------------------
# Conversation bidirectionnelle
#
# Frigate la désactive hors contexte sécurisé. Le port 5000 est du HTTP direct
# et ne la permet donc JAMAIS, quelle que soit la configuration ci-dessus :
# ouvrez https://<frigate>:8971 et acceptez le certificat auto-signé.
#
# Publiez ces ports dans la configuration réseau de l'add-on :
#   8971/tcp   interface HTTPS authentifiée
#   8555/tcp   WebRTC
#   8555/udp   WebRTC
# ---------------------------------------------------------------------------
