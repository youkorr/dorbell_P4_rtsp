# ---------------------------------------------------------------------
# Reference Frigate configuration for the ESP32-P4 doorbell.
#
# Replace every placeholder in CAPITALS. Frigate refuses to start on a single
# unresolved {VARIABLE}, and the error often points at a line that is not the
# culprit -- so check them all before hunting elsewhere.
# ---------------------------------------------------------------------

version: 0.17-0

mqtt:
  host: FRIGATE_HOST_IP
  port: 1883
  user: frigate
  password: "{FRIGATE_MQTT_PASSWORD}"
  stats_interval: 60

detectors:
  coral:
    type: edgetpu
    device: pci

birdseye:
  enabled: false

# ---------------------------------------------------------------------------
# go2rtc — embedded in Frigate, configured here
# ---------------------------------------------------------------------------
go2rtc:
  streams:
    # --- The ESP32-P4 doorbell ----------------------------------------------
    # EXACTLY ONE source may hold the ONVIF backchannel open. go2rtc requests it
    # by default on a bare rtsp:// URL, and any '#' fragment flips that default
    # off. Here `doorbell` is only the transcode input, so it gives it up with
    # '#backchannel=0'; `doorbell_webrtc` carries it, explicitly.
    #
    # Two sources requesting it at once is the number one cause of "push-to-talk
    # worked once and then never again".
    doorbell:
      - rtsp://RTSP_USER:RTSP_PASSWORD@DOORBELL_IP:8554/doorbell#backchannel=0

    # WebRTC cannot carry MJPEG, so the video has to be transcoded to H.264.
    # ffmpeg does the VIDEO ONLY -- no '#audio=copy'. It does not carry the
    # backchannel upstream, and with no audio track to copy it exits with an
    # error, which go2rtc then restarts in a loop (you see a connection and a
    # TEARDOWN every second in the P4's logs).
    #
    # The second line brings the microphone AND the backchannel directly, in
    # untouched G.711: no codec round trip on the voice.
    #
    # This transcode is unavoidable: the P4 emits only MJPEG. (H.264 was removed
    # from the component -- the P4 cannot decode it for its own LVGL preview;
    # see the README.)
    doorbell_webrtc:
      - ffmpeg:doorbell#video=h264#raw=-r 15 -g 15 -keyint_min 15
      - rtsp://RTSP_USER:RTSP_PASSWORD@DOORBELL_IP:8554/doorbell#backchannel=1

    # --- An existing camera, for illustration -------------------------------
    # Nothing to do with the doorbell; kept to show a normal camera alongside.
    frigate1:
      - rtsp://CAM_USER:CAM_PASSWORD@CAM_IP:554/stream1
      - ffmpeg:frigate1#audio=aac

  webrtc:
    listen: :8555
    # The address the BROWSER must reach -- the Frigate machine's own, not the
    # documentation's '1.2.3.4'. An unreachable candidate gives a connection
    # that establishes and never shows a picture.
    candidates:
      - FRIGATE_HOST_IP:8555

    # For access from outside, add your public IP and a configured TURN server
    # here. Unnecessary -- and harmful if left as a placeholder -- while you
    # stay on the LAN.

# ---------------------------------------------------------------------------
# Recording and snapshots
# ---------------------------------------------------------------------------
record:
  # Disabled globally: enabling it from the UI or over MQTT has no effect while
  # this key is false.
  enabled: false
  expire_interval: 60
  sync_recordings: true
  export:
    timelapse_args: -vf setpts=0.04*PTS -r 30
  preview:
    quality: medium
  alerts:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 14
  detections:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 14

snapshots:
  enabled: true
  clean_copy: true
  timestamp: false
  bounding_box: true
  retain:
    default: 10

semantic_search:
  enabled: false

# ---------------------------------------------------------------------------
# Cameras
# ---------------------------------------------------------------------------
cameras:
  doorbell:
    ffmpeg:
      inputs:
        # Consume go2rtc's restream, never the P4 directly: that way the
        # doorbell serves ONE RTSP client however many views are open. Its
        # `max_clients` is small, and the MJPEG chain already takes two
        # sessions.
        - path: rtsp://127.0.0.1:8554/doorbell_webrtc
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      # The OV5647 resolution as configured in the ESPHome YAML
      # (`esp_cam_sensor: resolution:`).
      width: 640
      height: 480
      # 5 fps is plenty for a doorbell and spares the detector. Aiming higher is
      # pointless: the stream tops out around 16 fps, limited by the LVGL
      # preview overhead rather than by the network.
      fps: 5
    live:
      # Frigate 0.15+ syntax: a dict of "display name" -> go2rtc stream.
      # (`stream_name:` was the 0.14 form and no longer exists.)
      streams:
        Doorbell: doorbell_webrtc
    objects:
      track:
        - person
      filters:
        person:
          min_score: 0.7
          threshold: 0.8
    motion:
      threshold: 30
      contour_area: 83
      improve_contrast: false
    notifications:
      # Frigate's own notifications fire on OBJECT DETECTION. They know nothing
      # about the doorbell button -- that is a Home Assistant automation, see
      # docs/home-assistant.md §10.
      enabled: true

  frigate1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/frigate1
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 1024
      height: 600
      fps: 30
    objects:
      track:
        - person
        - cat
      filters:
        person:
          min_score: 0.7
          threshold: 0.8
    motion:
      threshold: 30
      contour_area: 83
      improve_contrast: false
    notifications:
      enabled: true
