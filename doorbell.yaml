# NOTE : ce fichier est un EXEMPLE à copier dans /config/esphome/.
# `external_components` ne récupère que `components/`, pas ce YAML : après une
# mise à jour du dépôt, recopiez ce fichier si vous voulez les corrections.
# ESP32-P4 smart doorbell: MIPI-CSI camera + RTSP with two-way audio.
#
#   OV5647 --MIPI CSI--> ESP32-P4 --MJPEG/RTSP--> go2rtc --WebRTC--> Home Assistant
#                              <----- G.711 backchannel (talk) -----
#
# Everything below the camera and the audio (button, chime relay, LED, OTA...)
# is plain ESPHome, exactly as in the rest of the project.

substitutions:
  name: doorbell-p4
  friendly_name: Sonnette

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0

esp32:
  variant: esp32p4
  framework:
    type: esp-idf
    # The MIPI-CSI stack, the hardware JPEG encoder and the new I2S driver all
    # need a recent IDF.
    version: 5.4.0
    sdkconfig_options:
      # The camera and JPEG buffers live in PSRAM.
      CONFIG_SPIRAM: y
      CONFIG_SPIRAM_MODE_HEX: y
      CONFIG_SPIRAM_SPEED_200M: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_360: y
      # The RTSP task pushes RTP straight into lwIP; give it room to breathe.
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65534"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65534"

# NOTE: `rtsp_server` vit pour l'instant sur la branche de travail ci-dessous.
# Une fois la PR fusionnee, remplacez ces deux `ref:` par `main`.
#
# `refresh: 0s` n'est pas cosmetique. Par defaut ESPHome garde un clone en cache
# pendant UN JOUR, et il est indexe sur le NOM de la branche, pas sur le commit :
# si la branche avance, une compilation faite dans les 24 h precedentes continue
# d'utiliser l'ancien code, en silence. C'est ce qui produit des erreurs du genre
# « Unable to find action with the name 'rtsp_server.play_test_tone' » alors que
# l'action existe bel et bien dans le depot.
external_components:
  - source:
      type: git
      url: https://github.com/youkorr/dorbell_P4_rtsp
      ref: claude/doorbell-p4-rtsp-audio-gkdosc
    components: [rtsp_server]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: claude/doorbell-p4-rtsp-audio-gkdosc
    components: [esp_video]
    refresh: 0s

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# On an ESP32-P4 the radio lives in the ESP32-C6 companion; this is the usual
# esp-hosted setup, adjust to your board.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------

# SCCB/I2C bus the sensor is configured over. Shared with esp_video so there is
# no second driver fighting for the bus.
i2c:
  - id: cam_i2c
    sda: GPIO7
    scl: GPIO8
    frequency: 100kHz
    scan: false

esp_video:
  id: video
  i2c_id: cam_i2c
  xclk_pin: GPIO36 # -1 if your board has its own 24 MHz oscillator
  xclk_freq: 24000000
  enable_isp: true # RAW -> RGB565 conversion, feeds the JPEG encoder
  # MJPEG uses the ESP-IDF hardware JPEG driver directly, so enable_jpeg
  # (/dev/video10) is not required either.

# ---------------------------------------------------------------------------
# RTSP server (video + two-way audio)
# ---------------------------------------------------------------------------

rtsp_server:
  id: doorbell_stream
  port: 8554
  path: /doorbell
  username: !secret rtsp_username
  password: !secret rtsp_password
  # En MJPEG, go2rtc ouvre DEUX sessions RTSP (le transcodage H.264 + le
  # backchannel). 3 laisse de la marge pour un VLC de diagnostic.
  max_clients: 3

  video:
    # MJPEG only. The P4 has a hardware H.264 encoder, but nothing on the chip
    # decodes H.264 back, and the encoder consumes YUV420 while an LVGL preview
    # needs RGB565 -- so a screen and the stream could not share one camera.
    framerate: 15
    jpeg_quality: 25 # 1..100; ~25 keeps a frame around 40-60 kB

  audio:
    codec: pcmu # G.711 µ-law: no transcoding anywhere in the chain
    sample_rate: 16000 # I2S clock; the wire is always 8 kHz

    microphone: # INMP441 / ICS-43434
      mode: std
      i2s_port: 0
      bclk_pin: GPIO20
      lrclk_pin: GPIO21
      din_pin: GPIO22
      bits_per_sample: 32
      channel: left # L/R pin tied to GND
      gain: 6.0

    speaker: # MAX98357A
      i2s_port: 1
      bclk_pin: GPIO23
      lrclk_pin: GPIO26
      dout_pin: GPIO27
      bits_per_sample: 16
      channel: left
      volume: 0.8

    # There is no acoustic echo canceller: mute the microphone while the far
    # end is talking so the speaker cannot loop back into it.
    half_duplex: true
    talk_timeout: 300ms

  on_talk_start:
    - switch.turn_on: amp_enable
    - light.turn_on: status_led
  on_talk_end:
    - switch.turn_off: amp_enable
    - light.turn_off: status_led

# ---------------------------------------------------------------------------
# Doorbell button, chime and indicators — ordinary ESPHome
# ---------------------------------------------------------------------------

# The entity Home Assistant understands natively as a doorbell: it shows up as
# `event.<device>_sonnette`, its state is the timestamp of the last press, and
# it can be picked straight out of the automation editor as a trigger. A bare
# binary_sensor cannot do any of that -- nothing in Home Assistant reacts to one
# on its own, and a short pulse is easy to miss entirely.
event:
  - platform: template
    id: doorbell_event
    name: "Sonnette"
    device_class: doorbell
    event_types:
      - pressed

binary_sensor:
  - platform: gpio
    id: doorbell_button
    name: "Bouton"
    device_class: occupancy
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 100ms
    on_press:
      # Ring the local chime, then let Home Assistant do the notification.
      - switch.turn_on: chime_relay
      # Three ways out, so the press cannot be missed: the event entity, a raw
      # bus event for YAML automations, and this binary_sensor's own state.
      - event.trigger:
          id: doorbell_event
          event_type: pressed
      - homeassistant.event:
          event: esphome.doorbell_pressed
          data:
            device: ${name}
      - delay: 1s
      - switch.turn_off: chime_relay

  - platform: template
    name: "Micro actif"
    device_class: problem
    entity_category: diagnostic
    # Reversed on purpose: ON means there IS a problem, i.e. the microphone
    # source has stopped delivering samples altogether.
    lambda: 'return !id(doorbell_stream).mic_alive();'
  - platform: template
    name: "On vous parle"
    entity_category: diagnostic
    lambda: 'return id(doorbell_stream).is_talking();'

switch:
  - platform: gpio
    id: chime_relay
    name: "Carillon"
    pin: GPIO33
    restore_mode: ALWAYS_OFF

  # Shutdown pin of the MAX98357A. Keeping the amplifier off except while
  # talking removes idle hiss and stops it from feeding the microphone.
  - platform: gpio
    id: amp_enable
    pin: GPIO28
    restore_mode: ALWAYS_OFF

  # Speak in front of the doorbell and you hear yourself: capture, gain, G.711
  # and playback are all proven at once, with no network and nobody at the other
  # end. A bench test, not a mode to leave on -- microphone and speaker sit on
  # the same board and feedback is only a matter of volume.
  - platform: template
    name: "Test audio (boucle micro vers haut-parleur)"
    id: audio_loopback_switch
    icon: mdi:microphone-message
    entity_category: diagnostic
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - switch.turn_on: amp_enable
      - rtsp_server.set_loopback:
          id: doorbell_stream
          state: true
    turn_off_action:
      - rtsp_server.set_loopback:
          id: doorbell_stream
          state: false
      - switch.turn_off: amp_enable

light:
  - platform: status_led
    id: status_led
    pin: GPIO45

text_sensor:
  - platform: template
    name: "Flux RTSP"
    lambda: 'return {id(doorbell_stream).stream_url()};'
    update_interval: 60s

sensor:
  - platform: template
    name: "Clients RTSP"
    lambda: 'return id(doorbell_stream).client_count();'
    update_interval: 10s
    accuracy_decimals: 0

  # The microphone, measured rather than assumed. Read it like this:
  #   -100 dBFS   digital silence -- the source delivers zeros. Wrong I2S slot,
  #               dead capsule, gain at zero. No network setting will fix it.
  #   -60 .. -40  it hears, but faintly: raise `gain` in the audio block.
  #   -30 ..  -6  a healthy speech level.
  #      > -3     clipping: lower the gain.
  - platform: template
    name: "Niveau micro"
    unit_of_measurement: dBFS
    accuracy_decimals: 0
    device_class: sound_pressure
    state_class: measurement
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return id(doorbell_stream).mic_level_db();'

  # Stuck at 0 while you press talk in Home Assistant means the downstream voice
  # never reaches the P4 at all: the fault is upstream (go2rtc, or a backchannel
  # that was never negotiated), not in this component.
  - platform: template
    name: "Paquets audio recus"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(doorbell_stream).audio_packets_received();'

button:
  # Proves the speaker on its own: no beep, no point looking at Home Assistant.
  - platform: template
    name: "Bip de test"
    icon: mdi:volume-high
    entity_category: diagnostic
    on_press:
      - switch.turn_on: amp_enable
      - rtsp_server.play_test_tone:
          id: doorbell_stream
          frequency: 1000
          duration: 600ms
      - delay: 1s
      - switch.turn_off: amp_enable
