
substitutions:
  name: doorbell-p4
  friendly_name: Doorbell

esphome:
  name: ${name}
  friendly_name: ${friendly_name}


esp32:
  flash_size: 16MB
  variant: ESP32P4
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_GDMA_ISR_IRAM_SAFE: y
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"
      CONFIG_SPIRAM_RODATA: "n"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_LWIP_SO_RCVBUF: "y"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65534"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65534"
      CONFIG_WIFI_RMT_DYNAMIC_TX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_AMPDU_TX_ENABLED: "y"
      CONFIG_WIFI_RMT_TX_BA_WIN: "32"


external_components:
  - source:
      type: git
      url: https://github.com/youkorr/dorbell_P4_rtsp
      ref: claude/doorbell-p4-rtsp-audio-gkdosc
    components: [rtsp_server]
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: claude/usb-uvc-consumer-integration-gnbflf
    components: [esp_video, esp_cam_sensor]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# On an ESP32-P4 the radio lives in the ESP32-C6 companion; this is the usual
# esp-hosted setup, adjust to your board.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------

i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 100kHz
    scan: false

esp_video:
  id: video
  i2c_id: bsp_bus
  xclk_pin: GPIO36 # -1 if your board has its own 24 MHz oscillator
  xclk_freq: 24000000
  enable_isp: true # RAW -> RGB565 conversion, feeds the JPEG encoder
  enable_h264: false
  
esp_cam_sensor:
  id: p4_cam
  i2c_id: bsp_bus
  sensor_type: ov5647
  resolution: "800x640" #"1280x960"    #"800x640" 
  framerate: 30
  mirror_x: false
  mirror_y: false
  rotation: 0
# ---------------------------------------------------------------------------
# RTSP server (video + two-way audio)
# ---------------------------------------------------------------------------

rtsp_server:
  id: doorbell_stream
  port: 8554
  path: /doorbell
  username: !secret rtsp_username
  password: !secret rtsp_password
  # En MJPEG, go2rtc ouvre DEUX sessions RTSP (le transcodage H.264 + le
  # backchannel). 3 laisse de la marge pour un VLC de diagnostic.
  max_clients: 3

  video:
    codec: mjpeg # hardware JPEG encoder; H.264 is an option, see below
    framerate: 15
    jpeg_quality: 25 # 1..100; ~25 keeps a frame around 40-60 kB
    max_clients: 4
    drive_camera: false


  audio:
    codec: pcmu
    sample_rate: 16000
    microphone_id: board_microphone
    speaker_id: board_speaker
    gain: 6.0
    volume: 0.8
    half_duplex: true
    talk_timeout: 300ms

fdaudio:
  id: audio_engine
  lrclk_pin: GPIO10
  bclk_pin: GPIO12
  mclk_pin: GPIO13
  din_pin: GPIO11
  dout_pin: GPIO9
  i2c_port: 0
  output_codec: es8311
  output_address: 0x18
  mic_address: 0x40
  mic_gain_db: 30
  output_volume: 70
  sample_rate: 16000
  enable_aec: false      
  mic_digital_gain: 1.0     # 
  mic_agc: 0          # 
  echo_suppression: 0
  noise_gate: 0         #

microphone:
  - platform: fdaudio
    id: board_microphone
    fdaudio_id: audio_engine

speaker:
  - platform: fdaudio
    id: board_speaker
    fdaudio_id: audio_engine

  on_talk_start:
    - switch.turn_on: amp_enable
    - light.turn_on: status_led
  on_talk_end:
    - switch.turn_off: amp_enable
    - light.turn_off: status_led

# ---------------------------------------------------------------------------
# Doorbell button, chime and indicators — ordinary ESPHome
# ---------------------------------------------------------------------------

binary_sensor:
  - platform: gpio
    id: doorbell_button
    name: "Bouton"
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 100ms
    on_press:
      # Ring the local chime, then let Home Assistant do the notification.
      - switch.turn_on: chime_relay
      - delay: 1s
      - switch.turn_off: chime_relay

switch:
  - platform: gpio
    id: chime_relay
    name: "Carillon"
    pin: GPIO33
    restore_mode: ALWAYS_OFF

  # Shutdown pin of the MAX98357A. Keeping the amplifier off except while
  # talking removes idle hiss and stops it from feeding the microphone.
  - platform: gpio
    id: amp_enable
    pin: GPIO28
    restore_mode: ALWAYS_OFF

light:
  - platform: status_led
    id: status_led
    pin: GPIO45

text_sensor:
  - platform: template
    name: "Flux RTSP"
    lambda: 'return {id(doorbell_stream).stream_url()};'
    update_interval: 60s

sensor:
  - platform: template
    name: "Clients RTSP"
    lambda: 'return id(doorbell_stream).client_count();'
    update_interval: 10s
    accuracy_decimals: 0
